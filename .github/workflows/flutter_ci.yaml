  ios-build:
    name: Build and Distribute iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
      
      - name: Write app.env.dart from secret
        run: |
          mkdir -p lib/env
          echo "${{ secrets.APP_ENV_FILE }}" > lib/env/app.env.dart

      - name: Write firebase.env.dart from secret
        run: |
          mkdir -p lib/env
          echo "${{ secrets.FIREBASE_ENV_FILE }}" > lib/env/firebase.env.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Install provisioning profile
        run: |
          # Create provisioning profiles directory
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          
          # Decode provisioning profile
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision
          
          # Validate provisioning profile
          if [ ! -s ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision ]; then
            echo "Error: Provisioning profile is empty. Please check IOS_PROVISIONING_PROFILE_BASE64 secret."
            exit 1
          fi
          
          echo "Provisioning profile size: $(wc -c < ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision) bytes"

      - name: Set up certificate
        run: |
          # Decode and validate certificate
          echo "${{ secrets.IOS_CERTIFICATE_BASE64 }}" | base64 --decode > certificate.p12
          
          # Check if certificate file is not empty
          if [ ! -s certificate.p12 ]; then
            echo "Error: Certificate file is empty. Please check IOS_CERTIFICATE_BASE64 secret."
            exit 1
          fi
          
          # Display certificate file size for debugging
          echo "Certificate file size: $(wc -c < certificate.p12) bytes"
          
          # Create keychain with a temporary password
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          
          # Set keychain timeout to 1 hour
          security set-keychain-settings -t 3600 -l build.keychain
          
          # Import certificate with error handling
          if ! security import certificate.p12 -k build.keychain -P "${{ secrets.IOS_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign; then
            echo "Error: Failed to import certificate. Please check:"
            echo "1. IOS_CERTIFICATE_BASE64 secret contains valid base64 encoded .p12 file"
            echo "2. IOS_CERTIFICATE_PASSWORD secret is correct"
            echo "3. Certificate is not expired"
            exit 1
          fi
          
          # Set key partition list
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          
          # Clean up certificate file
          rm certificate.p12

      - name: Build iOS IPA
        run: flutter build ipa --release --no-codesign

      - name: Upload iOS to Firebase
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_IOS_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: Testers
          file: build/ios/ipa/*.ipa
